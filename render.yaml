services:
  # --------------------------------------------------------------------------
  # JIS Backend Web Service (Node.js Express API — 100% Free Tier)
  # Connects to an external hosted free MySQL database (e.g., Aiven Free MySQL)
  # --------------------------------------------------------------------------
  - type: web
    name: jis-backend
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: ALLOWED_ORIGINS
        value: https://jis-demo.vercel.app,http://localhost:3000,http://localhost:3001
      # External MySQL connection parameters (prompted securely in Render Dashboard)
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        value: jis_test_db
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      # TLS / SSL connection security (Provider CA verification enabled by default)
      - key: DB_SSL
        value: "true"
      - key: DB_SSL_REJECT_UNAUTHORIZED
        value: "true"
      - key: DB_CA
        sync: false
      - key: DB_CONNECTION_LIMIT
        value: "5"
